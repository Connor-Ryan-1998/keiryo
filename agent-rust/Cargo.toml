[package]
name = "monitoring-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "metrics", "with-serde"] }
prost = "0.14"
redb = "=4.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4.5"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "0.40.0", default-features = false, features = ["system", "disk", "network"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
