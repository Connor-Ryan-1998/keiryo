name: Validate keiryō

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A superseded main build must never overwrite latest after its replacement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
      - uses: go-task/setup-task@v1
      - name: Install pinned Rust toolchain
        working-directory: agent-rust
        run: rustup show active-toolchain
      - run: uv sync --locked
      - run: uv run --locked task lint
      - run: uv run --locked task test
      - run: uv run --locked task test SUITE=ui
      - run: uv run --locked task test SUITE=recovery
  container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate GHCR for main publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build verified fleet images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/connor-ryan-1998/monitoring:latest
            ghcr.io/connor-ryan-1998/monitoring:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Connor-Ryan-1998/keiryo
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
